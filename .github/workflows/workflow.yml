name: CI/CD Pipeline
on:
  push:
    branches: [sathwikiiit-patch-1]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@master
      - name: Set up JDK 11
        uses: actions/setup-java@master
        with:
          java-version: 11
          distribution: adopt
      - name: Build project
        run: ./gradlew assemble
      - name: Run tests
        run: ./gradlew test
