name: CI/CD Pipeline

on:
  push:
    branches: [sathwikiiit-patch-1]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 14
        uses: actions/setup-node@v4
        with:
          node-version: 14
          distribution: lts
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: adopt
      - name: Run build
        run: ./gradlew assemble
      - name: Run tests
        run: ./gradlew test
