name: CI/CD Pipeline
on:
  push:
    branches: [sathwikiiit-patch-1]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: adopt
      - name: use npm old
        run: nvm install 14.17.5;nvm use 14.17.5

      - name: Run build
        run: ./gradlew assemble
      - name: Run tests
        run: ./gradlew test
